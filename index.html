<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/public/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/public/css/styles.css">
    <script>
        (function() {
            try {
                var host = window.location.hostname;
                var isMain = host === 'gps.geozoone.com' || host === 'geozoone.com';
                var cached = localStorage.getItem('geozoone_branding_' + host);
                if (cached) {
                    var data = JSON.parse(cached);
                    if (data && data.title) {
                        document.title = data.title;
                        return;
                    }
                }
                document.title = isMain ? 'Geozoone' : 'Plataforma GPS';
            } catch (e) {
                document.title = 'Plataforma GPS';
            }
        })();
    </script>
    <title>Plataforma GPS</title>
</head>

<body>
    <noscript>Enable JavaScript to use <a href="https://www.traccar.org/">Traccar GPS Tracking System</a>.</noscript>
    <div id="root" class="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script type="module" src="/src/index.jsx"></script>
    <script src="/src/functionAdicional.js"></script>
</body>

</html>
